[package]
name = "desktop_overlay"
version = "0.1.0"
edition = "2021"

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dependencies]
sysinfo = "0.33"
gtk4-layer-shell = "0.8.0"
gtk = { version = "0.11.3", package = "gtk4", features = ["v4_22"] }
winit = { version = "0.30.13", default-features = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
once_cell = "1.21.4"
phf = { version = "0.14.0", features = ["macros"] }